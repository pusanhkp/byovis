<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426"><title>뵤비스 BYOVIS</title>
<style>
:root{--bg:#06101f;--card:#0d1c31;--line:#203754;--blue:#42a5ff;--text:#f4f8ff;--muted:#9dafc6;--green:#61dfa9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#17355d 0,#081528 32%,#050b15 70%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}
.app{max-width:520px;margin:auto;padding:24px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.logo{text-align:center;flex:1}.logo h1{font-size:38px;margin:14px 0 0;letter-spacing:-2px}.logo small{letter-spacing:6px;color:#dce9ff}.icon{font-size:25px;color:#cbd9ec;background:none;border:0}.tag{text-align:center;color:#b6c5d9;margin:20px 0 14px}.hero{background:linear-gradient(145deg,#0b1d35,#071323);border:1px solid var(--line);border-radius:26px;padding:24px 18px;text-align:center;box-shadow:0 18px 50px #0008}.orb{width:172px;height:172px;margin:8px auto 18px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#174d91,#06275a 58%,#04142d 70%);border:3px solid #68bdff;box-shadow:0 0 18px #3ca9ff,0 0 55px #176bc088;cursor:pointer;user-select:none}.orb.listening{animation:pulse 1s infinite}.mic{font-size:72px}.hero h2{margin:5px 0 4px}.status{color:var(--muted);min-height:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.card{border:1px solid var(--line);background:#0a1729cc;border-radius:20px;padding:18px 14px;min-height:105px;cursor:pointer}.card b{display:block;font-size:18px;margin:7px 0}.card span{font-size:13px;color:var(--muted)}.emoji{font-size:26px}.chat{margin-top:16px;background:#09172a;border:1px solid var(--line);border-radius:20px;padding:15px}.messages{max-height:260px;overflow:auto}.msg{padding:10px 12px;margin:7px 0;border-radius:14px;line-height:1.45}.me{background:#143963;margin-left:42px}.ai{background:#10243d;margin-right:42px}.input{display:flex;gap:8px;margin-top:12px}.input input{flex:1;border:1px solid var(--line);background:#06101f;color:white;border-radius:14px;padding:13px}.input button{border:0;border-radius:14px;background:var(--blue);color:#04101f;font-weight:800;padding:0 17px}.panel{display:none;margin-top:16px;background:#09172a;border:1px solid var(--line);border-radius:20px;padding:16px}.panel.show{display:block}.panel input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#06101f;color:white;margin:8px 0}.row{display:flex;gap:8px}.save{background:var(--green);border:0;padding:11px 15px;border-radius:12px;font-weight:800}.item{padding:10px;border-bottom:1px solid #1a304b;color:#dce8f8}.hint{text-align:center;color:#7890ad;font-size:12px;margin-top:16px}@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 35px #55b6ff,0 0 75px #1875d0}}
</style></head>
<body><main class="app">
<div class="top"><button class="icon">☰</button><div class="logo"><h1>뵤비스</h1><small>BYOVIS</small></div><button class="icon" onclick="alert('설정은 다음 버전에서 추가할게요.')">⚙</button></div>
<p class="tag">언제나, 당신 곁의 AI 비서</p>
<section class="hero"><div class="orb" id="mic"><div class="mic">🎙️</div></div><h2>아빠, 말씀하세요</h2><div class="status" id="status">마이크를 누르면 듣기 시작해요</div></section>
<div class="grid">
<div class="card" onclick="openPanel('todo')"><div class="emoji">✅</div><b>할 일 관리</b><span>해야 할 일을 기록해요</span></div>
<div class="card" onclick="openPanel('memo')"><div class="emoji">📝</div><b>메모하기</b><span>생각을 저장해요</span></div>
<div class="card" onclick="say('아직 일정 연동 전이에요. 다음 단계에서 캘린더를 연결해볼게요.')"><div class="emoji">📅</div><b>오늘 일정</b><span>일정 연결 준비중</span></div>
<div class="card" onclick="doSearch()"><div class="emoji">🔎</div><b>검색하기</b><span>웹에서 찾아봐요</span></div>
</div>
<section class="panel" id="memo"><b>📝 메모</b><div class="row"><input id="memoInput" placeholder="메모를 입력하세요"><button class="save" onclick="addItem('memo')">저장</button></div><div id="memoList"></div></section>
<section class="panel" id="todo"><b>✅ 할 일</b><div class="row"><input id="todoInput" placeholder="할 일을 입력하세요"><button class="save" onclick="addItem('todo')">추가</button></div><div id="todoList"></div></section>
<section class="chat"><div class="messages" id="messages"><div class="msg ai">안녕하세요! 뵤비스입니다. 마이크를 누르거나 아래에 입력해보세요.</div></div><div class="input"><input id="text" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')sendText()"><button onclick="sendText()">➤</button></div></section>
<div class="hint">1차 프로토타입 · 내용은 이 기기의 브라우저에 저장됩니다.</div>
</main>
<script>
const $=id=>document.getElementById(id); let recognition;
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.speak(u)}}
function addMsg(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=9999}
function say(t){addMsg(t,'ai');speak(t)}
function answer(t){let s=t.trim();if(!s)return;addMsg(s,'me');let a;if(/안녕|뵤비스/.test(s))a='네, 여기 있어요. 무엇을 도와드릴까요?';else if(/메모/.test(s)){openPanel('memo');a='메모장을 열었어요.'}else if(/할 ?일/.test(s)){openPanel('todo');a='할 일 목록을 열었어요.'}else if(/시간/.test(s))a='지금은 '+new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})+'이에요.';else if(/날짜|오늘/.test(s))a='오늘은 '+new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+'이에요.';else a='지금은 1차 버전이라 간단한 명령만 가능해요. 다음 단계에서 AI를 연결하면 훨씬 자연스럽게 대화할 수 있어요.';setTimeout(()=>say(a),250)}
function sendText(){let i=$('text'),t=i.value;i.value='';answer(t)}
function openPanel(id){['memo','todo'].forEach(x=>$(x).classList.toggle('show',x===id));render(id)}
function addItem(type){let inp=$(type+'Input'),v=inp.value.trim();if(!v)return;let a=JSON.parse(localStorage.getItem('byovis_'+type)||'[]');a.unshift(v);localStorage.setItem('byovis_'+type,JSON.stringify(a));inp.value='';render(type)}
function render(type){let a=JSON.parse(localStorage.getItem('byovis_'+type)||'[]'),el=$(type+'List');el.innerHTML=a.map((x,i)=>`<div class="item" onclick="del('${type}',${i})">${escapeHtml(x)} <span style="float:right;color:#7188a5">×</span></div>`).join('')||'<div class="item">아직 저장된 내용이 없어요.</div>'}
function del(type,i){let a=JSON.parse(localStorage.getItem('byovis_'+type)||'[]');a.splice(i,1);localStorage.setItem('byovis_'+type,JSON.stringify(a));render(type)}
function escapeHtml(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}
function doSearch(){let q=prompt('무엇을 검색할까요?');if(q)location.href='https://www.google.com/search?q='+encodeURIComponent(q)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.lang='ko-KR';recognition.interimResults=false;recognition.onstart=()=>{$('mic').classList.add('listening');$('status').textContent='듣고 있어요...'};recognition.onend=()=>{$('mic').classList.remove('listening');$('status').textContent='마이크를 누르면 듣기 시작해요'};recognition.onerror=e=>{$('status').textContent='음성 인식 오류: '+e.error};recognition.onresult=e=>answer(e.results[0][0].transcript);$('mic').onclick=()=>recognition.start()}else{$('mic').onclick=()=>alert('이 브라우저는 음성인식을 지원하지 않아요. Chrome 계열 브라우저에서 테스트해 주세요.');$('status').textContent='텍스트 입력으로 먼저 사용해보세요.'}
render('memo');render('todo');
</script></body></html>
