<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>뵤비스 BYOVIS v0.4</title>
<style>
:root{--bg:#06101f;--card:#0d1c31;--line:#203754;--blue:#42a5ff;--text:#f4f8ff;--muted:#9dafc6;--green:#61dfa9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#17355d 0,#081528 32%,#050b15 70%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}
.app{max-width:520px;margin:auto;padding:24px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.logo{text-align:center;flex:1}.logo h1{font-size:36px;margin:12px 0 0}.logo small{letter-spacing:2px;color:#bcd9ff}.tag{text-align:center;color:var(--muted);margin:10px 0 20px}
.hero{background:linear-gradient(145deg,#0b1d35,#071323);border:1px solid var(--line);border-radius:26px;padding:22px 18px;text-align:center;box-shadow:0 18px 50px #0008}
.orb{width:165px;height:165px;margin:8px auto 16px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#174d91,#06275a 58%,#04142d 70%);border:3px solid #68bdff;box-shadow:0 0 18px #3ca9ff,0 0 55px #176b0888;cursor:pointer;user-select:none}
.orb.listening{animation:pulse 1s infinite}.mic{font-size:68px}.hero h2{margin:4px 0}.status{color:var(--muted);min-height:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{border:1px solid var(--line);background:#0a1729;border-radius:20px;padding:17px 13px;min-height:94px;cursor:pointer}.card b{display:block;font-size:17px;margin:5px 0}.card span{font-size:13px;color:var(--muted)}.emoji{font-size:25px}
.panel{display:none;margin-top:16px;background:#09172a;border:1px solid var(--line);border-radius:20px;padding:16px}.panel.show{display:block}.row{display:flex;gap:8px}.row input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#06101f;color:white}
button.save{border:0;border-radius:12px;padding:0 16px;background:var(--blue);font-weight:800;color:#04101f}.item{padding:12px 2px;border-bottom:1px solid var(--line)}.item small{display:block;color:var(--muted);margin-top:4px}.empty{color:var(--muted);padding:10px 0}
.chat{margin-top:16px;background:#09172a;border:1px solid var(--line);border-radius:20px;padding:14px}.messages{max-height:230px;overflow:auto}.msg{padding:10px 12px;margin:7px 0;border-radius:14px}.msg.ai{background:#143963}.msg.me{background:#10243d;margin-left:42px}.input{display:flex;gap:8px;margin-top:12px}.input input{flex:1;border:1px solid var(--line);background:#06101f;color:white;border-radius:14px;padding:13px}.input button{border:0;border-radius:14px;background:var(--blue);font-weight:800;padding:0 16px}
.note{font-size:12px;color:var(--muted);margin-top:13px;text-align:center}
@keyframes pulse{50%{box-shadow:0 0 35px #67c5ff,0 0 75px #176bff}}
</style>
</head>
<body><main class="app">
<div class="top"><div></div><div class="logo"><h1>뵤비스</h1><small>BYOVIS v0.4</small></div><div></div></div>
<p class="tag">말하면, 기억하고 다시 알려주는 개인 비서</p>
<section class="hero">
<div class="orb" id="mic" onclick="startListening()"><div class="mic">🎙️</div></div>
<h2>아빠, 말씀하세요</h2><div class="status" id="status">마이크를 누르면 듣기 시작해요</div>
</section>
<div class="grid">
<div class="card" onclick="openMemo()"><div class="emoji">📝</div><b>메모</b><span>저장한 메모 확인</span></div>
<div class="card" onclick="readMemos()"><div class="emoji">🔊</div><b>메모 읽기</b><span>저장된 메모를 음성으로</span></div>
</div>
<section class="panel" id="memo"><b>📝 메모</b><div class="row" style="margin-top:10px"><input id="memoInput" placeholder="메모를 입력하세요"><button class="save" onclick="addMemo()">저장</button></div><div id="memoList"></div></section>
<section class="chat"><div class="messages" id="messages"><div class="msg ai">안녕하세요. 뵤비스입니다. “메모해줘”, “메모 보여줘”, “메모 읽어줘”라고 말해보세요.</div></div>
<div class="input"><input id="text" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')sendText()"><button onclick="sendText()">전송</button></div></section>
<div class="note">메모는 현재 이 기기의 브라우저에 저장됩니다.</div>
</main>
<script>
const $=id=>document.getElementById(id);
let recognition=null;
let memoCapture=false;
let restarting=false;

function speak(text, after){
  if(!('speechSynthesis' in window)){ if(after) after(); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR';
  u.onend=()=>{if(after) setTimeout(after,250)};
  u.onerror=()=>{if(after) setTimeout(after,250)};
  speechSynthesis.speak(u);
}
function addMsg(text,who='ai'){
  const d=document.createElement('div'); d.className='msg '+who; d.textContent=text;
  $('messages').appendChild(d); $('messages').scrollTop=99999;
}
function getMemos(){try{return JSON.parse(localStorage.getItem('byovis-memos')||'[]')}catch(e){return []}}
function saveMemos(a){localStorage.setItem('byovis-memos',JSON.stringify(a))}
function cleanCommand(s){return s.trim().replace(/[.!?。]/g,'').replace(/\s+/g,' ')}
function saveMemoText(text){
  text=text.trim().replace(/^[,.\s]+|[,.\s]+$/g,'');
  if(!text){say('메모할 내용을 말씀해주세요.');return}
  const a=getMemos();
  a.unshift({text, time:new Date().toLocaleString('ko-KR')});
  saveMemos(a); renderMemos(); addMsg('메모했어요: '+text);
  speak(text+' 메모했어요.');
}
function addMemo(){const v=$('memoInput').value.trim();if(!v)return;saveMemoText(v);$('memoInput').value=''}
function renderMemos(){
  const a=getMemos(), box=$('memoList'); box.innerHTML='';
  if(!a.length){box.innerHTML='<div class="empty">저장된 메모가 없습니다.</div>';return}
  a.forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML='<b></b><small></small>';d.querySelector('b').textContent=x.text;d.querySelector('small').textContent=x.time;box.appendChild(d)})
}
function openMemo(){ $('memo').classList.add('show'); renderMemos(); $('memo').scrollIntoView({behavior:'smooth'}); }
function showMemosByVoice(){
  openMemo(); const n=getMemos().length;
  const t=n?`저장된 메모 ${n}개를 화면에 보여드릴게요.`:'저장된 메모가 없어요.';
  addMsg(t); speak(t);
}
function readMemos(){
  const a=getMemos(); openMemo();
  if(!a.length){say('저장된 메모가 없어요.');return}
  const text='저장된 메모는 '+a.length+'개입니다. '+a.map((x,i)=>(i+1)+'번째, '+x.text).join('. ');
  addMsg(text); speak(text);
}
function say(t){addMsg(t);speak(t)}
function enterMemoCapture(){
  memoCapture=true; addMsg('네, 말씀하세요.');
  speak('네, 말씀하세요.',()=>startListening(true));
}
function handleCommand(raw){
  const s=cleanCommand(raw);
  // 조회 명령을 저장 명령보다 반드시 먼저 검사
  if(/메모\s*(보여\s*줘|보여줘|확인\s*해\s*줘|확인해줘|목록)/.test(s)){showMemosByVoice();return}
  if(/메모\s*(읽어\s*줘|읽어줘|읽어\s*봐|읽어봐)/.test(s)){readMemos();return}

  // “내용 + 메모해줘” / “메모해줘 + 내용”
  const memoWords='(?:메모\\s*해\\s*줘|메모해줘|기억\\s*해\\s*줘|기억해줘|적어\\s*줘|적어줘)';
  let re=new RegExp('^'+memoWords+'\\s*(.*)$');
  let m=s.match(re);
  if(m){
    if(m[1] && m[1].trim()) saveMemoText(m[1].trim());
    else enterMemoCapture();
    return;
  }
  re=new RegExp('^(.*?)\\s*'+memoWords+'$');
  m=s.match(re);
  if(m){
    if(m[1] && m[1].trim()) saveMemoText(m[1].trim());
    else enterMemoCapture();
    return;
  }
  say('아직 그 명령은 배우는 중이에요.');
}
function startListening(isFollowup=false){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say('이 브라우저에서는 음성 인식을 지원하지 않아요. 크롬에서 다시 시도해주세요.');return}
  try{ if(recognition) recognition.abort(); }catch(e){}
  recognition=new SR(); recognition.lang='ko-KR'; recognition.interimResults=false; recognition.continuous=false;
  $('mic').classList.add('listening'); $('status').textContent=isFollowup?'메모 내용을 듣고 있어요…':'듣고 있어요…';
  recognition.onresult=e=>{
    const t=e.results[0][0].transcript.trim(); addMsg(t,'me');
    if(memoCapture){memoCapture=false;saveMemoText(t)}else handleCommand(t);
  };
  recognition.onerror=e=>{
    $('status').textContent='다시 마이크를 눌러주세요';
    if(memoCapture && (e.error==='no-speech'||e.error==='aborted')) memoCapture=false;
  };
  recognition.onend=()=>{$('mic').classList.remove('listening');$('status').textContent='마이크를 누르면 듣기 시작해요'};
  try{recognition.start()}catch(e){}
}
function sendText(){const i=$('text'),t=i.value.trim();if(!t)return;i.value='';addMsg(t,'me');if(memoCapture){memoCapture=false;saveMemoText(t)}else handleCommand(t)}
renderMemos();
</script></body></html>
